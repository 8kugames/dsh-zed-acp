name: Zed ACP plugin

on:
  # No paths filter: a release tag points at an already-pushed commit, so a
  # paths-filtered push trigger would suppress the publish run entirely.
  push:
    branches: ['**']
    tags:
      - 'zed-acp-v*'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/zed-acp.yml'
  workflow_dispatch:

concurrency:
  group: zed-acp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tags run the full matrix too: publish needs test, and a skipped
  # needs-dependency would skip publish entirely.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # esbuild's platform binary ships in its optional dependency, so the
      # skipped postinstall does not affect the build.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  publish:
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/zed-acp-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Assert the tag matches the manifest and registry versions
        run: |
          test "${GITHUB_REF_NAME#zed-acp-v}" = "$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME#zed-acp-v}" = "$(node -p "require('./registry/agent.json').version")"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # This job checks out a clean tree and --ignore-scripts skips the
      # prepare hook, so dist/ must be built here; needs: test only gates the
      # run and does not carry artifacts from the test job's runners.
      - run: npm run build
      # Trusted publishing exchanges the Actions OIDC token for a short-lived
      # credential; setting NODE_AUTH_TOKEN here would disable that path.
      - run: npm publish --access public
